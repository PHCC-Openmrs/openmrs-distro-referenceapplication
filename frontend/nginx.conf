worker_processes  1;
user              nobody;

events {
  worker_connections  1024;
  multi_accept        off;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  tcp_nopush    on;
  tcp_nodelay   on;
  sendfile      on;

  keepalive_timeout  65;

  map $http_user_agent $loggable {
    default 1;
    "~Blackbox-Exporter" 0;
  }

  access_log /var/log/nginx/access.log combined if=$loggable;

  server {
    listen  80;
    root    /usr/share/nginx/html;
    index   index.html;

    # never cache the service-worker
    location ~* service-worker\.js$ {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # importmap.json and routes.registry.json decide which set of hashed
    # chunks make up one consistent build; a stale copy of either can mix
    # chunks from two different builds. Never cache them.
    location ~* /(importmap\.json|routes\.registry\.json)$ {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    location ~* (\.js|openmrs\.(\w*\.)?css)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # handle anything with a "." that's not an HTML file
    # assume it's a static file
    location ~* \.(?!html?)[^.]+$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # any other URL should serve the single page. index.html embeds this
    # build's importmap reference / runtime config, so it must never be
    # cached either.
    location / {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files /index.html =404;
    }
  }
 }
