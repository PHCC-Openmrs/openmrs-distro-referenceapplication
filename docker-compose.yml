services:
  gateway:
    image: ${IMAGE_PREFIX:-openmrs}/openmrs-reference-application-3-gateway:${TAG:-qa}
    build:
      context: ./gateway
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
      - portainer
    extra_hosts:
      # Lets gateway reach the `webhook` listener bound to 127.0.0.1:9000 on
      # the host, for the /hooks/ proxy_pass in its nginx config.
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    restart: "unless-stopped"
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  frontend:
    image: ${IMAGE_PREFIX:-openmrs}/openmrs-reference-application-3-frontend:${TAG:-qa}
    build: 
      context: ./frontend
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    image: ${IMAGE_PREFIX:-openmrs}/openmrs-reference-application-3-backend:${TAG:-qa}
    build:
      context: .
    restart: "unless-stopped"
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: ${OMRS_CONFIG_CONNECTION_SERVER:-db}
      OMRS_CONFIG_CONNECTION_DATABASE: ${OMRS_CONFIG_CONNECTION_DATABASE:- openmrs}
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      # MariaDB JDBC driver (already in the WAR) instead of MySQL Connector/J: on Gaza time the
      # MySQL driver throws "HOUR_OF_DAY: 0 -> 1" reading a DATE whose midnight was skipped by a
      # daylight-saving switch (39 dates 1957-2022, e.g. birthdate 1994-04-01). useMysqlMetadata
      # keeps the reported product name "MySQL", so Liquibase dbms="mysql" changesets still apply.
      OMRS_CONFIG_DATABASE: mariadb
      OMRS_CONFIG_CONNECTION_ARGS: "?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8&useMysqlMetadata=true"
      # Gaza time, wherever the VM is. The JVM's timezone decides how report dates
      # (yyyy-MM-dd) become day boundaries and how timestamps are saved. TZ covers the OS
      # clock and logs.
      TZ: Asia/Gaza
      OMRS_JAVA_SERVER_OPTS: "-Duser.timezone=Asia/Gaza"
      # Sized for a 4-core backend. A fixed heap avoids resize churn (the image default only sets
      # -XX:NewSize=128m, so the heap starts at ~200 MB and grows under load). Two JIT compiler
      # threads instead of the JVM's default (3 on 4 cores, 12 on 16) keep compilation after a
      # restart from taking every core while the first users arrive. Set OMRS_JAVA_HEAP in .env to
      # resize: roughly 40% of the VM's RAM when the database runs elsewhere.
      OMRS_JAVA_MEMORY_OPTS: "-Xms${OMRS_JAVA_HEAP:-3g} -Xmx${OMRS_JAVA_HEAP:-3g} -XX:CICompilerCount=2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data

  portainer:
    image: portainer/portainer-ce:latest
    restart: "unless-stopped"
    environment:
      TRUSTED_ORIGINS: https://${CERT_WEB_DOMAINS:-localhost},http://localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      # Gaza time for CURDATE()/NOW() (time_zone=SYSTEM follows TZ). Must match the backend.
      TZ: Asia/Gaza
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
  portainer-data: ~
