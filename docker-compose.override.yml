# version: "3.7"

services:
  gateway:
    build:
      context: ./gateway

  frontend:
    build:
      context: ./frontend
      # Build openmrs-esm-core from the local checkout (sibling to this repo)
      # instead of cloning PHCC-Openmrs/openmrs-esm-core from GitHub, so local
      # edits are picked up without needing to commit/push first. Remove
      # these two lines (or set ESM_CORE_SOURCE back to "esm-core-remote") to
      # go back to building against whatever's actually pushed to `main`.
      additional_contexts:
        - esm-core-local=../openmrs-esm-core
      args:
        ESM_CORE_SOURCE: esm-core-local-aliased
        # The Dockerfile defaults to the floating `next` prerelease tag for the
        # openmrs CLI (app-shell builder), which republishes multiple times a
        # day and can ship breaking changes with no warning -- it's what broke
        # the Module Federation runtime here (esm-core's rspack.config.js
        # didn't set `experiments.provideExternalRuntime`, which some recent
        # `next` prerelease started requiring). Pin to the stable release for
        # local dev builds instead.
        APP_SHELL_VERSION: latest

  backend:
    build:
      context: .

  db:
    ports:
      - "3306:3306"
