name: Deploy to Prod

# Builds and pushes the selected images, then pins each newly built image's
# immutable <branch>-<sha> tag in the SOPS-encrypted .env and commits it.
# doco-cd on the prod VM picks up that commit and redeploys -- see
# ops/doco-cd/README.md.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to build and deploy
        type: choice
        options:
          - all
          - backend
          - frontend
          - gateway
        default: all

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: phcc-openmrs
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed service paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      gateway: ${{ steps.resolve.outputs.gateway }}
    steps:
      - name: Resolve which services to build
        id: resolve
        env:
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          for s in backend frontend gateway; do
            if [ "$SELECTED_SERVICE" = "all" ] || [ "$SELECTED_SERVICE" = "$s" ]; then
              echo "$s=true" >> "$GITHUB_OUTPUT"
            else
              echo "$s=false" >> "$GITHUB_OUTPUT"
            fi
          done

  build-and-push:
    name: Build and push images to GHCR
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      # The org only allows actions owned by PHCC-Openmrs, so this job uses
      # git and the docker CLI preinstalled on the runner instead of
      # actions/checkout and the docker/* actions.
      - name: Check out the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=${auth}" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # Docker tags can't contain "/", so feature/foo becomes feature-foo.
      - name: Compute image tags
        id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "tag=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${branch}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          DOCKER_USERNAME: ${{ secrets.GHUB_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.GHUB_DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login "$REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA_TAG: ${{ steps.tag.outputs.sha_tag }}
          BUILD_BACKEND: ${{ needs.changes.outputs.backend }}
          BUILD_FRONTEND: ${{ needs.changes.outputs.frontend }}
          BUILD_GATEWAY: ${{ needs.changes.outputs.gateway }}
        run: |
          set -euo pipefail
          build() {  # <service> <context> [extra docker build args...]
            local svc=$1 context=$2; shift 2
            local image="${REGISTRY}/${IMAGE_NAMESPACE}/openmrs-reference-application-3-${svc}"
            echo "::group::Build and push ${svc}"
            docker buildx build --push "$@" \
              -t "${image}:${TAG}" -t "${image}:${SHA_TAG}" "$context"
            echo "::endgroup::"
          }
          # if-blocks, not `cond && build`: set -e is ignored inside a
          # function called from an && list, which would hide a failed build.
          if [ "$BUILD_BACKEND" = "true" ]; then
            build backend .
          fi
          if [ "$BUILD_FRONTEND" = "true" ]; then
            build frontend ./frontend --build-arg "CACHE_BUST=${GITHUB_RUN_ID}"
          fi
          if [ "$BUILD_GATEWAY" = "true" ]; then
            build gateway ./gateway
          fi

      - name: Log out of GHCR
        if: always()
        run: docker logout "$REGISTRY" || true

  update-env-tags:
    name: Open a PR that pins the built image tags in .env
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: write
      pull-requests: write
    env:
      # The branch doco-cd deploys prod from, set as a variable on the `prod`
      # environment (keep it in sync with Key Vault openmrs-vm-deploy-branch).
      # .env is only updated when the pipeline runs on this branch.
      DEPLOY_BRANCH: ${{ vars.PROD_DEPLOY_BRANCH }}
      # The deploy branch only accepts changes through pull requests, so each
      # run pushes the .env change to <prefix><run id> and opens a PR.
      PR_BRANCH_PREFIX: deploy/prod-tags-
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check deploy branch
        id: gate
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_BRANCH" ]; then
            echo "::error::PROD_DEPLOY_BRANCH variable is not set on the prod environment."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEPLOY_BRANCH" ]; then
            echo "::notice::Ran on ${GITHUB_REF_NAME}, but prod deploys from ${DEPLOY_BRANCH}; .env not updated."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Every .env change rewrites sops_mac, so two open tag PRs always
      # conflict. Build on top of the newest open tag PR (if any) so this PR
      # carries its pending tags too; that PR is closed as superseded below.
      - name: Check out the deploy branch or the open tag PR
        id: base
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # Kept in local config so later steps can push; the runner is
          # discarded after the job.
          git config http.extraheader "$auth"

          prev=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${DEPLOY_BRANCH}&per_page=100" |
            jq -c --arg prefix "$PR_BRANCH_PREFIX" --arg repo "$GITHUB_REPOSITORY" '
              [.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith($prefix)))]
              | sort_by(.created_at) | last // empty')

          if [ -n "$prev" ]; then
            prev_number=$(jq -r .number <<<"$prev")
            prev_ref=$(jq -r .head.ref <<<"$prev")
            echo "Building on open tag PR #${prev_number} (${prev_ref})."
            git fetch -q origin "$prev_ref"
            echo "prev_number=${prev_number}" >> "$GITHUB_OUTPUT"
            echo "prev_ref=${prev_ref}" >> "$GITHUB_OUTPUT"
          else
            git fetch -q origin "$DEPLOY_BRANCH"
          fi
          git checkout -q -B "${PR_BRANCH_PREFIX}${GITHUB_RUN_ID}" FETCH_HEAD

      - name: Install sops
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Set image tags in .env
        id: set
        if: steps.gate.outputs.run == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          BUILT_BACKEND: ${{ needs.changes.outputs.backend }}
          BUILT_FRONTEND: ${{ needs.changes.outputs.frontend }}
          BUILT_GATEWAY: ${{ needs.changes.outputs.gateway }}
        run: |
          set -euo pipefail
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::SOPS_AGE_KEY secret is not set in the prod environment — cannot update .env."
            exit 1
          fi

          updated=()
          for svc in backend frontend gateway; do
            built_var="BUILT_${svc^^}"
            if [ "${!built_var}" = "true" ]; then
              sops set .env "[\"${svc^^}_TAG\"]" "\"${SHA_TAG}\""
              updated+=("$svc")
            fi
          done

          echo "services=${updated[*]}" >> "$GITHUB_OUTPUT"
          echo "Pinned ${updated[*]:-nothing} to ${SHA_TAG}"

      - name: Commit, push and open the PR
        if: steps.gate.outputs.run == 'true'
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          SERVICES: ${{ steps.set.outputs.services }}
          PREV_NUMBER: ${{ steps.base.outputs.prev_number }}
          PREV_REF: ${{ steps.base.outputs.prev_ref }}
        run: |
          set -euo pipefail
          api() {  # <method> <path> [json body]
            curl -fsSL -X "$1" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}$2" ${3:+--data "$3"}
          }

          if git diff --quiet -- .env; then
            echo "No tag changes to commit."
            exit 0
          fi

          services="${SERVICES// /, }"
          title="Pin ${services} image tag to ${SHA_TAG}"
          pr_branch="${PR_BRANCH_PREFIX}${GITHUB_RUN_ID}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$title" -- .env
          git push -q origin "HEAD:refs/heads/${pr_branch}"

          # shellcheck disable=SC2016 # backticks are literal Markdown
          body=$(printf 'Built by [Deploy to Prod run %s](%s) from `%s`.\n\nSets `.env` image tags for **%s** to `%s`. Merging this deploys them: doco-cd picks up the commit on `%s`.' \
            "$GITHUB_RUN_ID" "$run_url" "$GITHUB_SHA" "$services" "$SHA_TAG" "$DEPLOY_BRANCH")
          if [ -n "$PREV_NUMBER" ]; then
            body=$(printf '%s\n\nAlso includes the tags from #%s, which this supersedes.' "$body" "$PREV_NUMBER")
          fi

          pr=$(api POST /pulls "$(jq -n \
            --arg title "$title" --arg head "$pr_branch" \
            --arg base "$DEPLOY_BRANCH" --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}')")
          pr_number=$(jq -r .number <<<"$pr")
          pr_url=$(jq -r .html_url <<<"$pr")
          echo "Opened ${pr_url}"
          echo "### Merge [#${pr_number}](${pr_url}) to deploy ${services} (\`${SHA_TAG}\`)" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$PREV_NUMBER" ]; then
            api POST "/issues/${PREV_NUMBER}/comments" \
              "$(jq -n --arg b "Superseded by #${pr_number}, which includes these tags." '{body: $b}')" >/dev/null
            api PATCH "/pulls/${PREV_NUMBER}" '{"state":"closed"}' >/dev/null
            git push -q origin --delete "$PREV_REF" || true
            echo "Closed superseded PR #${PREV_NUMBER}."
          fi
